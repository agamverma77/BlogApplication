# Server Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework
 
# Database Configuration (Defaults to local H2, overridable in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./db/blogdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
 
# H2 Console Configuration
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/db-console
spring.h2.console.settings.web-allow-others=false
 
# Hibernate DDL Auto Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=true

# Error Handling Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Gemini AI API Key
gemini.api.key=${GEMINI_API_KEY:}