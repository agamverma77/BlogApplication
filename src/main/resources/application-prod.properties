# ========================================================
# Production Configuration Profile (Spring Profile: prod)
# ========================================================

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blogverse}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Disable H2 in Production
spring.h2.console.enabled=false

# Gemini AI API Key (safe empty fallback)
gemini.api.key=${GEMINI_API_KEY:}
