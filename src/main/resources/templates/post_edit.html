<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragements/head :: head}">
</head>

<body class="sub_page">

    <div class="hero_area">
        <div class="bg-box">
            <img th:src="@{/images/nav-bg.jpg}" alt="">
        </div>
        <header th:replace="~{fragements/header :: header}"></header>
    </div>

    <!-- Edit Post Section -->
    <section class="food_section layout_padding">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-9 bg-white p-4 rounded shadow-sm border">
                    <div class="form_container">
                        <h3 class="font-weight-bold mb-4">Edit Post</h3>
                        <form th:action="@{'/post/{id}/edit' (id=${post.id})}" th:object="${post}" method="post">
                            <div class="form-group mb-3">
                                <label for="title" class="font-weight-bold text-dark">Title</label>
                                <input id="title" th:field="*{title}" name="title" type="text" class="form-control"
                                    placeholder="Enter an engaging post title..." required />
                                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="alert alert-danger mt-1" role="alert">Title Error</p>
                            </div>
                            <div class="form-group mb-4">
                                <label for="editor" class="font-weight-bold text-dark">Content</label>
                                <textarea id="editor" th:field="*{body}" name="body" class="form-control" rows="10"
                                    placeholder="Edit your article content here..."></textarea>
                                <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}" class="alert alert-danger mt-1" role="alert">Body Error</p>
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{'/post/' + ${post.id}}" class="btn btn-outline-secondary rounded-pill px-4">
                                    Cancel
                                </a>
                                <button type="submit" class="btn btn-warning rounded-pill px-4 font-weight-bold text-dark">
                                    <i class="fa fa-save mr-1"></i> Update Post
                                </button>
                            </div>
                        </form>
                        
                        <!-- Text Editor -->
                        <script src="https://cdn.ckeditor.com/ckeditor5/41.0.0/classic/ckeditor.js"></script>
                        <script>
                            ClassicEditor.create(document.querySelector('#editor')).catch(error => {
                                console.error(error);
                            });
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragements/footer :: footer}"></footer>

</body>
</html>
