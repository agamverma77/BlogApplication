<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

   <head th:replace="~{/fragements/head :: head}">


<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img th:src="@{/images/nav-bg.jpg}" alt="">
    </div>
    <header th:replace="~{/fragements/header :: header}">
  </div>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Danger</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        Are you sure?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <a  th:href="@{'/post/'+${post.id} + '/delete'}" class="btn btn-danger btn-lg active" role="button" aria-pressed="true">Delete</a>
      </div>
    </div>
  </div>
</div>
  <!-- about section -->

  <section class="about_section layout_padding">
    <div class="container  ">
        <div class="post">
          <h3><a th:text="${post.title}">Title</a></h3>
          <h5 th:text="'Author: ' + (${post.account != null and post.account.firstname != null ? post.account.firstname : 'Anonymous'}) + 
          ' | Created at: ' + (${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm') : 'Recently'}) +
          ' | Updated at: ' + (${post.updatedAt != null ? #temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm') : 'Recently'})"></h5>
          
          <div th:if="${post.summary != null}" class="alert alert-info mt-3 mb-4" role="alert">
            <strong>✨ AI Summary:</strong> <span th:text="${post.summary}"></span>
          </div>

          <p th:utext="${post.body}">body</p> <!--thymleaf will replace these small texts "Title" "body" with whatever is there-->
          <hr color="grey"/>
          <div sec:authorize="isAuthenticated()" th:if="${isOwner}">
          <a  th:href="@{'/post/'+${post.id} + '/edit'}" class="btn btn-secondary btn-lg active" role="button" aria-pressed="true">Edit</a> |
          <!-- Button trigger modal -->
<button type="button" class="btn btn-warning" data-toggle="modal" data-target="#exampleModal">
  Delete
</button>
          
          </div>

          <!-- Comments Section -->
          <hr color="grey"/>
          <h4 class="mb-3">Comments</h4>
          
          <!-- Add Comment Form -->
          <div sec:authorize="isAuthenticated()" class="mb-4">
              <form action="#" th:action="@{'/post/' + ${post.id} + '/comments'}" th:object="${comment}" method="post">
                  <div class="form-group">
                      <textarea th:field="*{body}" class="form-control" rows="3" placeholder="Leave a comment..." style="background-color: #2c3440; color: #ffffff; border: 1px solid #4a5568;"></textarea>
                      <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}" class="text-danger"></p>
                  </div>
                  <button type="submit" class="btn btn-primary mt-2">Submit Comment</button>
              </form>
          </div>
          <div sec:authorize="!isAuthenticated()" class="mb-4">
              <p><a th:href="@{/login}" class="text-warning">Log in</a> to leave a comment.</p>
          </div>

          <!-- List Comments -->
          <div th:if="${#lists.isEmpty(post.comments)}" class="text-muted mb-4">
              <em>No comments yet. Be the first to comment!</em>
          </div>

          <div th:each="comment : ${post.comments}" class="p-3 mb-3 rounded" style="background-color: #2c3440; border: 1px solid #4a5568;">
              <p class="mb-1" style="color: #f8f9fa; font-size: 1rem; white-space: pre-wrap;" th:text="${comment.body}"></p>
              <small style="color: #adb5bd;" th:text="'- ' + (${comment.account != null and comment.account.firstname != null ? comment.account.firstname : 'Anonymous'}) + ' on ' + (${comment.createdAt != null ? #temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm') : 'Recently'})"></small>
          </div>

      </div>
      
    </div>
  </section>
  <footer th:replace="~{/fragements/footer :: footer}">
  <!-- end about section -->
  
  

</body>

</html>
