<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{/fragements/head :: head}">
</head>

<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img th:src="@{/images/nav-bg.jpg}" alt="">
    </div>
    <header th:replace="~{/fragements/header :: header}"></header>
  </div>

  <!-- Delete Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title font-weight-bold text-danger" id="exampleModalLabel">Delete Post</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          Are you sure you want to permanently delete this post? This action cannot be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <a th:href="@{'/post/'+${post.id} + '/delete'}" class="btn btn-danger font-weight-bold" role="button">Delete</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Post Detail Section -->
  <section class="about_section layout_padding">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border mb-4">
            <h1 class="font-weight-bold text-dark mb-3" th:text="${post.title}">Title</h1>
            
            <div class="d-flex align-items-center text-muted mb-4 flex-wrap small">
              <span class="mr-3">
                <i class="fa fa-user mr-1 text-warning"></i>
                <span th:text="${post.account != null and post.account.firstname != null ? post.account.firstname : 'Anonymous'}">Author</span>
              </span>
              <span class="mr-3">
                <i class="fa fa-calendar mr-1 text-warning"></i>
                <span th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'MMM dd, yyyy HH:mm') : 'Recently'}">Date</span>
              </span>
              <span class="badge badge-light border px-2 py-1">
                <i class="fa fa-clock mr-1"></i> <span th:text="${post.getEstimatedReadTime()} + 'm read'">3m read</span>
              </span>
            </div>
            
            <div th:if="${post.summary != null}" class="alert alert-info border-left-primary mb-4 p-3 rounded" style="background-color: #f0f4ff; border-left: 4px solid #6366f1;">
              <strong class="text-primary"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> AI Summary:</strong> 
              <span class="text-dark ml-1" th:text="${post.summary}"></span>
            </div>

            <div class="post-content mb-4 text-dark" style="font-size: 1.05rem; line-height: 1.8;" th:utext="${post.body}">
              body
            </div>

            <div sec:authorize="isAuthenticated()" th:if="${isOwner}" class="pt-3 border-top d-flex gap-2">
              <a th:href="@{'/post/'+${post.id} + '/edit'}" class="btn btn-sm btn-outline-secondary rounded-pill px-3 mr-2">
                <i class="fa fa-edit mr-1"></i> Edit Post
              </a>
              <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-3" data-toggle="modal" data-target="#exampleModal">
                <i class="fa fa-trash mr-1"></i> Delete Post
              </button>
            </div>
          </div>

          <!-- Comments Section -->
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border">
            <h3 class="h4 font-weight-bold text-dark mb-4">
              <i class="fa-regular fa-comments mr-2 text-warning"></i>
              Comments (<span th:text="${post.comments != null ? post.comments.size() : 0}">0</span>)
            </h3>
            
            <!-- Add Comment Form -->
            <div sec:authorize="isAuthenticated()" class="mb-4">
              <form th:action="@{'/post/' + ${post.id} + '/comments'}" th:object="${comment}" method="post">
                <div class="form-group mb-2">
                  <textarea th:field="*{body}" class="form-control" rows="3" placeholder="Join the discussion... Share your thoughts!" required></textarea>
                  <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}" class="text-danger mt-1 small"></p>
                </div>
                <button type="submit" class="btn btn-warning font-weight-bold rounded-pill px-4 text-dark">
                  Post Comment
                </button>
              </form>
            </div>
            
            <div sec:authorize="!isAuthenticated()" class="alert alert-light border mb-4">
              <a th:href="@{/login}" class="text-warning font-weight-bold">Log in</a> or <a th:href="@{/register}" class="text-warning font-weight-bold">Register</a> to leave a comment.
            </div>

            <!-- List Comments -->
            <div th:if="${post.comments == null or #lists.isEmpty(post.comments)}" class="text-muted text-center py-4">
              <em>No comments yet. Be the first to start the conversation!</em>
            </div>

            <div th:if="${post.comments != null and !#lists.isEmpty(post.comments)}">
              <div th:each="comment : ${post.comments}" class="p-3 mb-3 rounded bg-light border">
                <p class="mb-2 text-dark" style="font-size: 0.95rem; white-space: pre-wrap;" th:text="${comment.body}"></p>
                <small class="text-muted">
                  <i class="fa fa-user-circle mr-1"></i>
                  <strong th:text="${comment.account != null and comment.account.firstname != null ? comment.account.firstname : 'Anonymous'}"></strong>
                  • <span th:text="${comment.createdAt != null ? #temporals.format(comment.createdAt, 'MMM dd, yyyy HH:mm') : 'Recently'}"></span>
                </small>
              </div>
            </div>

          </div>

        </div>
      </div>
    </div>
  </section>

  <footer th:replace="~{/fragements/footer :: footer}"></footer>

</body>
</html>
