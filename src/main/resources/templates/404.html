<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/fragements/head :: head}">
</head>

<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img th:src="@{/images/nav-bg.jpg}" alt="">
    </div>
    <header th:replace="~{/fragements/header :: header}"></header>
  </div>

  <!-- 404 Section -->
  <section class="about_section layout_padding text-center py-5">
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8 bg-white p-5 rounded shadow-sm border">
          <h1 class="display-1 font-weight-bold text-warning mb-2">404</h1>
          <h2 class="font-weight-bold text-dark mb-3">Page Not Found</h2>
          <p class="lead text-muted mb-4">
            The page you are looking for does not exist or has been moved.
          </p>
          <a th:href="@{/}" class="btn btn-warning rounded-pill px-4 py-2 font-weight-bold text-dark">
            <i class="fa fa-home mr-1"></i> Return Home
          </a>
        </div>
      </div>
    </div>
  </section>

  <footer th:replace="~{/fragements/footer :: footer}"></footer>

</body>
</html>
