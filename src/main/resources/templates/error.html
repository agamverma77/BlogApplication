<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>BlogVerse - Error</title>
  
  <!-- Bootstrap CSS & FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: #0c0f1d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .error-card {
      background: #151a30;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 600px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
    }
    .error-icon {
      font-size: 4rem;
      color: #ffbe33;
      margin-bottom: 20px;
    }
    .btn-warning {
      background-color: #ffbe33;
      border-color: #ffbe33;
      color: #111;
      font-weight: 700;
    }
    .btn-warning:hover {
      background-color: #e69c00;
      border-color: #e69c00;
      color: #000;
    }
    .btn-outline-light {
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }
    .btn-outline-light:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: #fff;
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="error-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h2 class="font-weight-bold mb-3">Something Went Wrong</h2>
    <p class="text-light mb-4" style="opacity: 0.85;" th:text="${message != null and !message.isEmpty() ? message : 'An unexpected error occurred while processing your request.'}">
      An unexpected error occurred while processing your request.
    </p>
    <div th:if="${status != null}" class="badge badge-dark border border-secondary px-3 py-2 mb-4" style="font-size: 0.9rem;">
      HTTP Status: <span th:text="${status}">500</span>
    </div>
    <div>
      <a th:href="@{/}" class="btn btn-warning rounded-pill px-4 py-2 mr-2">
        <i class="fa fa-home mr-1"></i> Back to Home
      </a>
      <a href="javascript:history.back()" class="btn btn-outline-light rounded-pill px-4 py-2">
        <i class="fa fa-arrow-left mr-1"></i> Go Back
      </a>
    </div>
  </div>

</body>
</html>
