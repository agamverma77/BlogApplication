<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragements/head :: head}">
</head>

<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img th:src="@{/images/nav-bg.jpg}" alt="">
    </div>
    <header th:replace="~{fragements/header :: header}"></header>
  </div>

  <!-- Profile section -->
  <section class="book_section layout_padding">
    <div class="container">
      <div class="heading_container mb-4">
        <h2>My Profile</h2>
      </div>
      
      <div class="row justify-content-center">
        <!-- Photo Update Card -->
        <div class="col-md-4 mb-4">
          <div class="bg-white p-4 rounded shadow-sm border text-center">
            <div class="mb-3">
              <img th:src="@{${photo}}" class="rounded-circle img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;" alt="Avatar" />
            </div>
            <p th:text="${error}" th:if="${error ne null}" class="alert alert-danger"></p>
            <form method="post" th:action="@{/update-photo}" enctype="multipart/form-data">
              <div class="form-group mb-3">
                <input type="file" name="file" class="form-control-file" />
              </div>
              <button type="submit" class="btn btn-warning btn-block font-weight-bold rounded-pill text-dark">
                Update Photo
              </button>
            </form>
          </div>
        </div>

        <!-- Details Update Card -->
        <div class="col-md-7 mb-4">
          <div class="bg-white p-4 rounded shadow-sm border">
            <div class="form_container">
              <form th:action="@{/profile}" th:object="${account}" method="post">
                <input type="hidden" id="id" name="id" th:field="*{id}" />
                <div class="form-group mb-3">
                  <label for="email" class="font-weight-bold text-dark">Email Address</label>
                  <input id="email" name="email" type="email" th:field="*{email}" class="form-control" placeholder="Email" required />
                  <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="alert alert-danger mt-1 p-2" role="alert">Email Error</p>
                </div>
                <div class="form-group mb-3">
                  <label for="password" class="font-weight-bold text-dark">Password</label>
                  <input id="password" type="password" th:field="*{password}" class="form-control" placeholder="Password" required />
                  <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="alert alert-danger mt-1 p-2" role="alert">Password Error</p>
                </div>
                <div class="form-row">
                  <div class="form-group col-md-6 mb-3">
                    <label for="firstname" class="font-weight-bold text-dark">First Name</label>
                    <input id="firstname" type="text" th:field="*{firstname}" class="form-control" placeholder="First name" required />
                    <p th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}" class="alert alert-danger mt-1 p-2" role="alert">Firstname Error</p>
                  </div>
                  <div class="form-group col-md-6 mb-3">
                    <label for="lastname" class="font-weight-bold text-dark">Last Name</label>
                    <input id="lastname" type="text" th:field="*{lastname}" class="form-control" placeholder="Last name" required />
                    <p th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}" class="alert alert-danger mt-1 p-2" role="alert">Lastname Error</p>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group col-md-4 mb-3">
                    <label for="age" class="font-weight-bold text-dark">Age</label>
                    <input id="age" type="number" th:field="*{age}" min="18" max="99" class="form-control" placeholder="Age" required />
                    <p th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="alert alert-danger mt-1 p-2" role="alert">Age Error</p>
                  </div>
                  <div class="form-group col-md-4 mb-3">
                    <label for="date_of_birth" class="font-weight-bold text-dark">Date of Birth</label>
                    <input id="date_of_birth" type="date" th:field="*{date_of_birth}" class="form-control" required />
                    <p th:if="${#fields.hasErrors('date_of_birth')}" th:errors="*{date_of_birth}" class="alert alert-danger mt-1 p-2" role="alert">Date of birth Error</p>
                  </div>
                  <div class="form-group col-md-4 mb-3">
                    <label for="gender" class="font-weight-bold text-dark">Gender</label>
                    <select id="gender" name="gender" th:field="*{gender}" class="form-control">
                      <option value="Male">Male</option>
                      <option value="Female">Female</option>
                      <option value="Others">Others</option>
                    </select>
                    <p th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="alert alert-danger mt-1 p-2" role="alert">Gender Error</p>
                  </div>
                </div>
                <div class="btn_box mt-3">
                  <button type="submit" class="btn btn-warning btn-block font-weight-bold rounded-pill text-dark py-2">
                    Update Profile
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer th:replace="~{fragements/footer :: footer}"></footer>

</body>
</html>
